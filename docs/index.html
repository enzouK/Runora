<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runora — Flashcards com FSRS</title>
  <meta name="description" content="Runora é um app moderno e multiplataforma de flashcards com algoritmo FSRS, disponível para Windows (.exe) e Android (.apk), com sincronização opcional via Google Drive." />
  <style>
    :root { --bg: #0f1115; --fg: #e8eaf0; --muted: #9aa3b2; --accent: #6c8cff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { max-width: 640px; text-align: center; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-size: 13px; margin-bottom: 20px; }
    h1 { font-size: 44px; margin-bottom: 12px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 17px; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn { padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; }
    a.btn.primary { background: var(--accent); color: #fff; }
    a.btn.ghost { border: 1px solid #2a2f3a; color: var(--fg); }
    footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="badge">FSRS nativo • Windows • Android • Web</div>
    <h1>Run<span>ora</span></h1>
    <p>Um app moderno de flashcards com o algoritmo <strong>FSRS</strong> integrado, com decks, tipos de nota, templates de card, mídia rica e sincronização opcional via Google Drive.</p>
    <div class="links">
      <a class="btn primary" href="https://github.com/enzouK/Runora">Ver no GitHub</a>
      <a class="btn ghost" href="https://github.com/enzouK/Runora#instala%C3%A7%C3%A3o">Instalar</a>
      <a class="btn ghost" href="https://enzouk.github.io/Runora/PRIVACY.html">Privacidade</a>
    </div>
    <footer>Feito com ❤️ por <a href="https://github.com/enzouK">enzouK</a> • <a href="https://enzouk.github.io/Runora/PRIVACY.html">Política de Privacidade</a></footer>
  </main>
</body>
</html>
